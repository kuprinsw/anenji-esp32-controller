substitutions:
  name: anenji-esp32
  device_description: "Monitor and control ANENJI inverter via RS485 on ESP32"
  tx_pin: GPIO17  # TX pin
  rx_pin: GPIO16  # RX pin
  rs485_dir_pin: GPIO4  # DE/RE pin

esphome:
  name: ${name}
  friendly_name: ANENJI ESP32
  name_add_mac_suffix: false
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "anenji.esp32-controller"
    version: 1.0.0

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  
  ap:
    ssid: "ANENJI Setup"
    password: "12345678"

captive_portal:

web_server:
  port: 80
  version: 2
  include_internal: true

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: "NFSGYrdThO141pCEcUvy43l9ZN+YMw0TdxkbVjJM/YA="

ota:
  - platform: esphome
    password: "32724d2beca3da50795374354b181e18"

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    flow_control_pin: ${rs485_dir_pin}
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 10s

time:
  - platform: sntp

sensor:
  # Fault code
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "fault code"
    id: fault_code
    address: 100
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Warning code
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "warning code"
    id: warning_code
    address: 108
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Operation Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "operation mode id"
    id: operation_mode_id
    address: 201
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0

  # AC Voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac voltage"
    id: ac_voltage
    address: 202
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # AC Frequency
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac frequency"
    id: ac_frequency
    address: 203
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Average mains power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "average mains power"
    id: avg_mains_power
    address: 204
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Inverter voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter voltage"
    id: inverter_voltage
    address: 205
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Inverter current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter current"
    id: inverter_current
    address: 206
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Inverter frequency
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter frequency"
    id: inverter_frequency
    address: 207
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Average inverter power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "average inverter power"
    id: avg_inverter_power
    address: 208
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Inverter charging power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter charging power"
    id: inverter_charging_power
    address: 209
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Output voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output voltage"
    id: output_voltage
    address: 210
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output current"
    id: output_current
    address: 211
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Output frequency
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output frequency"
    id: output_frequency
    address: 212
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Output active power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output active power"
    id: output_active_power
    address: 213
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Output apparent power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output apparent power"
    id: output_apparent_power
    address: 214
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0

  # Battery voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery voltage"
    id: battery_voltage
    address: 215
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery current"
    id: battery_current
    address: 216
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Battery power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery power"
    id: battery_power
    address: 217
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # PV voltage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "pv voltage"
    id: pv_voltage
    address: 219
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV current
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "pv current"
    id: pv_current
    address: 220
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # PV power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "pv power"
    id: pv_power
    address: 223
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Load percentage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "load percentage"
    id: load_percentage
    address: 225
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # DCDC Temperature
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "dcdc temperature"
    id: dcdc_temperature
    address: 226
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # Inverter Temperature
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter temperature"
    id: inverter_temperature
    address: 227
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # Battery state of charge
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery soc"
    id: battery_soc
    address: 229
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0

  # Rated power
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "rated power"
    id: rated_power
    address: 643
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0

select:
  # Output Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output mode"
    use_write_multiple: true
    address: 300
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Single": 0
      "Parallel": 1
      "Phase P1": 2
      "Phase P2": 3
      "Phase P3": 4

  # Output priority
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output priority"
    use_write_multiple: true
    address: 301
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Utility-PV-Battery": 0
      "PV-Utility-Battery": 1
      "PV-Battery-Utility": 2

  # Input voltage range
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "input voltage range"
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "Wide range": 0
      "Narrow range": 1

  # Battery type
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery type"
    use_write_multiple: true
    address: 322
    value_type: U_WORD
    entity_category: config
    optionsmap:
      "AGM": 0
      "FLD": 1
      "USER": 2
      "Li1": 3
      "Li2": 4
      "Li3": 5
      "Li4": 6
      "Lib": 8

switch:
  # LCD automatically returns to the homepage
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "lcd auto return"
    use_write_multiple: true
    address: 306
    register_type: holding
    bitmask: 1

  # Energy-saving mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "energy-saving mode"
    use_write_multiple: true
    address: 307
    register_type: holding
    bitmask: 1

  # Overload automatic restart
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "overload auto restart"
    use_write_multiple: true
    address: 308
    register_type: holding
    bitmask: 1

  # Over temperature automatic restart
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "over temp auto restart"
    use_write_multiple: true
    address: 309
    register_type: holding
    bitmask: 1

  # Overload transfer to bypass
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "overload bypass"
    use_write_multiple: true
    address: 310
    register_type: holding
    bitmask: 1

text_sensor:
  # Operation Mode
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "operation mode"
    id: operation_mode
    address: 201
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus_controller::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Power On");
        case 1: return std::string("Standby");
        case 2: return std::string("Mains");
        case 3: return std::string("Off-Grid");
        case 4: return std::string("Bypass");
        case 5: return std::string("Charging");
        case 6: return std::string("Fault");
      }
      return std::string("Unknown");
